services:
  bookmarks:
    build: .
    # Or use a published image once you have pushed one:
    # image: ghcr.io/j4ckxyz/bluesky-bookmark-manager:latest
    restart: unless-stopped
    ports:
      - '8787:8787'
    volumes:
      - bookmarks-data:/data
    environment:
      # Generate one with: openssl rand -base64 32
      # Leave unset and the server creates and stores its own in /data.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # Set this to your public address when running behind a reverse proxy;
      # it switches session cookies to secure-only.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-false}

      # Single-user by default: the first account to sign in claims the
      # instance. Set MULTI_USER=true to let others sign in too.
      MULTI_USER: ${MULTI_USER:-false}
      ALLOWED_HANDLES: ${ALLOWED_HANDLES:-}

      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-10}
      FULL_SYNC_EVERY: ${FULL_SYNC_EVERY:-6}
      LOG_LEVEL: ${LOG_LEVEL:-info}

volumes:
  bookmarks-data:
